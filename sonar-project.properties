# En proyectos JS/TS SonarQube Cloud lee la configuración de este archivo, no del pom.
sonar.organization=cafeorbe
sonar.projectKey=cafeorbe-web
sonar.host.url=https://sonarcloud.io

sonar.featureflag.cloud-security-enable-secrets-S8135=true
sonar.featureflag.cloud-security-enable-secrets-S8136=true

# Los tests viven junto al código (src/features/sala/salaReducer.test.ts), así que sources
# y tests apuntan al mismo directorio y lo que los separa es test.inclusions.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts

# Generado por `npm run test:coverage`; ver la nota de coverage en vite.config.ts.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# La cobertura de un fichero de test no significa nada: no se mide.
sonar.coverage.exclusions=**/*.test.ts
